<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0c0d12">
    <meta name="description" content="Nino OS iPad is an original iPad-first operating-system-style playfield with browser games and built-in utilities.">
    <link rel="canonical" href="https://carloslara12302014-cell.github.io/nino-os-playfield/">
    <meta property="og:title" content="Nino OS iPad">
    <meta property="og:description" content="An original iPad-first launcher with browser games and built-in utilities.">
    <meta property="og:url" content="https://carloslara12302014-cell.github.io/nino-os-playfield/">
    <meta property="og:type" content="website">
    <title>Nino OS iPad</title>
    <link rel="stylesheet" href="desktop.css?v=14">
    <script src="app.js?v=14" defer></script>
  </head>
  <body>
    <main class="desktop" id="desktop">
      <header class="ipad-status-bar" aria-label="iPad status">
        <strong class="ipad-status-time" id="ipad-time">9:41</strong>
        <span class="status-icons" aria-hidden="true"><i>●●</i><i>⌁</i><i>▰</i></span>
      </header>
      <header class="desktop-widgets">
        <div class="welcome-widget">
          <span class="widget-spark" aria-hidden="true">✦</span>
          <span class="welcome-copy"><strong>Good to see you</strong><small>Make today a little more playful</small></span>
        </div>
        <div class="clock-widget">
          <span class="clock-label"><i aria-hidden="true"></i> LOCAL TIME</span>
          <time id="desktop-time"></time>
          <span id="desktop-date"></span>
        </div>
      </header>

      <section class="desktop-icons" aria-label="Desktop apps">
        <button class="desktop-shortcut" type="button" data-app="explorer"><span class="app-icon icon-folder"><span>▰</span></span><span>File Explorer</span></button>
        <a class="desktop-shortcut" href="https://www.microsoft.com/edge" target="_blank" rel="noopener noreferrer"><span class="app-icon icon-edge"><span>e</span></span><span>Microsoft Edge</span></a>
        <button class="desktop-shortcut" type="button" data-app="store"><span class="app-icon icon-store"><span>▣</span></span><span>Store</span></button>
        <button class="desktop-shortcut" type="button" data-app="notepad"><span class="app-icon icon-notepad"><span>▤</span></span><span>Notepad</span></button>
        <button class="desktop-shortcut" type="button" data-app="calculator"><span class="app-icon icon-calculator"><span>＋</span></span><span>Calculator</span></button>
        <button class="desktop-shortcut" type="button" data-app="settings"><span class="app-icon icon-settings"><span>⚙</span></span><span>Settings</span></button>
        <button class="desktop-shortcut" type="button" data-app="games"><span class="app-icon icon-games"><span>✦</span></span><span>Games</span></button>
        <button class="desktop-shortcut" type="button" data-app="tubi"><span class="app-icon icon-tubi"><span>▶</span></span><span>Tubi</span></button>
        <button class="desktop-shortcut" type="button" data-app="guide"><span class="app-icon icon-guide"><span>✳</span></span><span>AI Assistant</span></button>
        <a class="desktop-shortcut" href="https://cineosweb.github.io/" target="_blank" rel="noopener noreferrer"><span class="app-icon icon-cine"><span>C</span></span><span>Cine-OS</span></a>
        <a class="desktop-shortcut" href="https://www.opera.com/gx" target="_blank" rel="noopener noreferrer"><span class="app-icon icon-opera"><span>O</span></span><span>Opera GX</span></a>
        <a class="desktop-shortcut" href="https://www.google.com/" target="_blank" rel="noopener noreferrer"><span class="app-icon icon-google"><span>G</span></span><span>Google Search</span></a>
      </section>

      <section class="app-window" id="app-window" aria-labelledby="window-title" hidden>
        <header class="window-titlebar">
          <div class="window-app"><span class="window-app-icon" id="window-app-icon">✳</span><span id="window-title">Nino OS iPad</span></div>
          <div class="window-controls" aria-label="Window controls">
            <button type="button" id="back-to-desktop" aria-label="Back to desktop" title="Back to desktop">←</button>
            <button type="button" id="minimize-window" aria-label="Minimize">−</button>
            <button type="button" id="maximize-window" aria-label="Maximize" aria-pressed="false">□</button>
            <button type="button" id="close-window" class="close-window" aria-label="Close">×</button>
          </div>
        </header>
        <div class="app-content" id="app-content"></div>
      </section>

      <section class="start-menu" id="start-menu" aria-label="Start menu" hidden>
        <div class="start-header"><strong>Apps</strong><span>Open or switch apps without leaving this desktop</span></div>
        <label class="sr-only" for="start-search">Search apps</label>
        <input id="start-search" class="start-search" type="search" placeholder="Search apps">
        <div class="start-section-title">Pinned</div>
        <div class="start-app-grid" id="start-app-grid"></div>
        <div class="start-footer"><span>Nino OS iPad</span><span class="profile-dot">N</span></div>
      </section>
    </main>

    <nav class="taskbar" aria-label="iPad dock">
      <div class="taskbar-center">
        <button type="button" class="taskbar-button start-button" id="start-button" aria-label="Open Apps menu" title="Open apps" aria-expanded="false">
          <span class="pane-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="start-button-label">Apps</span>
        </button>
        <form class="taskbar-search" id="web-search-form">
          <label class="sr-only" for="web-search">Search apps or the web</label>
          <span aria-hidden="true">⌕</span>
          <input id="web-search" type="search" placeholder="Search apps or the web">
        </form>
        <button type="button" class="taskbar-button pinned-button" data-app="explorer" aria-label="Open File Explorer"><span class="app-icon icon-folder"><span>▰</span></span></button>
        <button type="button" class="taskbar-button pinned-button" data-app="games" aria-label="Open Games"><span class="app-icon icon-games"><span>✦</span></span></button>
        <a class="taskbar-button pinned-button" href="https://www.opera.com/gx" target="_blank" rel="noopener noreferrer" aria-label="Open Opera GX"><span class="app-icon icon-opera"><span>O</span></span></a>
        <button type="button" class="taskbar-button active-app" id="taskbar-app" aria-label="Restore open app" hidden><span class="taskbar-app-icon">✳</span><span id="taskbar-app-title"></span></button>
      </div>
      <div class="system-tray"><span class="tray-symbol" aria-hidden="true">⌃</span><span class="tray-symbol" aria-hidden="true">◔</span><div><time id="tray-time"></time><span id="tray-date"></span></div></div>
    </nav>
  </body>
</html>
